openapi: 3.0.3
info:
  title: Operations API
  version: 1.0.0
  description: Staff, attendance, office work, payroll, and reports for one organisation.
    Fictional data only.
paths:
  /api/v1/attendance/:
    get:
      operationId: attendance_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
  /api/v1/attendance/{id}/:
    get:
      operationId: attendance_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance.
        required: true
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
