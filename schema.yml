components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        shift:
          type: integer
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        day_status:
          type: string
          readOnly: true
      required:
      - date
      - day_status
      - employee
      - ends_at
      - id
      - shift
      - starts_at
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assignment:
          type: integer
          readOnly: true
        check_in:
          type: string
          format: date-time
          readOnly: true
        check_out:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assignment
      - check_in
      - check_out
      - id
    AttendanceCounts:
      type: object
      properties:
        scheduled_days:
          type: integer
        present:
          type: integer
        open:
          type: integer
        absent:
          type: integer
        paid_leave:
          type: integer
        unpaid_leave:
          type: integer
        scheduled:
          type: integer
        worked_seconds:
          type: integer
      required:
      - absent
      - open
      - paid_leave
      - present
      - scheduled
      - scheduled_days
      - unpaid_leave
      - worked_seconds
    AttendanceRow:
      type: object
      properties:
        employee:
          type: integer
        employee_number:
          type: string
        name:
          type: string
        department:
          type: string
        scheduled_days:
          type: integer
        present:
          type: integer
        open:
          type: integer
        absent:
          type: integer
        paid_leave:
          type: integer
        unpaid_leave:
          type: integer
        scheduled:
          type: integer
        worked_seconds:
          type: integer
      required:
      - absent
      - department
      - employee
      - employee_number
      - name
      - open
      - paid_leave
      - present
      - scheduled
      - scheduled_days
      - unpaid_leave
      - worked_seconds
    AttendanceSummary:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        employees:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRow'
        totals:
          $ref: '#/components/schemas/AttendanceCounts'
      required:
      - employees
      - month
      - totals
      - year
    CheckIn:
      type: object
      properties:
        assignment:
          type: integer
          minimum: 1
      required:
      - assignment
    DecisionEnum:
      enum:
      - approved
      - rejected
      type: string
      description: |-
        * `approved` - approved
        * `rejected` - rejected
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 30
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - code
      - id
      - name
    DepartmentCount:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        count:
          type: integer
      required:
      - code
      - count
      - name
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        employee_number:
          type: string
          maxLength: 30
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        department:
          type: integer
        job_title:
          type: string
          maxLength: 150
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - department
      - employee_number
      - first_name
      - id
      - role
      - start_date
      - user
    EmployeeUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        employee_number:
          type: string
          maxLength: 30
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        department:
          type: integer
        job_title:
          type: string
          maxLength: 150
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - department
      - employee_number
      - first_name
      - id
      - role
      - start_date
      - user
    Entry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timesheet:
          type: integer
          readOnly: true
        description:
          type: string
          maxLength: 500
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      required:
      - description
      - ends_at
      - id
      - starts_at
      - timesheet
    Headcount:
      type: object
      properties:
        date:
          type: string
          format: date
        total:
          type: integer
        by_department:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentCount'
        by_role:
          type: array
          items:
            $ref: '#/components/schemas/RoleCount'
      required:
      - by_department
      - by_role
      - date
      - total
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        revision:
          type: string
        demo_until:
          type: string
          format: date
          nullable: true
      required:
      - demo_until
      - revision
      - status
      - version
    Holiday:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        date:
          type: string
          format: date
      required:
      - date
      - id
      - name
    Leave:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        leave_type:
          $ref: '#/components/schemas/LeaveTypeEnum'
        reason:
          type: string
          maxLength: 500
        working_dates:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RequestStatusEnum'
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        review_note:
          type: string
          readOnly: true
        cancelled_by:
          type: integer
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancelled_at
      - cancelled_by
      - created_at
      - employee
      - end_date
      - id
      - leave_type
      - reason
      - review_note
      - reviewed_at
      - reviewed_by
      - start_date
      - status
      - working_dates
    LeaveTypeEnum:
      enum:
      - paid
      - unpaid
      type: string
      description: |-
        * `paid` - Paid
        * `unpaid` - Unpaid
    Overtime:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timesheet:
          type: integer
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        duration_seconds:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RequestStatusEnum'
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        reviewed_at:
