components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        shift:
          type: integer
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        day_status:
          type: string
          readOnly: true
      required:
      - date
      - day_status
      - employee
      - ends_at
      - id
      - shift
      - starts_at
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assignment:
          type: integer
          readOnly: true
        check_in:
          type: string
          format: date-time
          readOnly: true
        check_out:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assignment
      - check_in
      - check_out
      - id
